<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Usage</title>
<style>
  :root {
    --bg: #16141f; --card: #211e2e; --text: #ece9f4; --muted: #8f8aa3;
    --accent: #d97757; --ok: #4caf7d; --warn: #e0a63c; --bad: #e05252;
    --track: #2f2b40;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 40px 16px;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  #updated { color: var(--muted); font-size: 12px; margin-bottom: 28px; }
  .grid { display: grid; gap: 16px; width: 100%; max-width: 640px; }
  .card {
    background: var(--card); border-radius: 14px; padding: 20px 22px;
    border: 1px solid #2c2840;
  }
  .card h2 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; }
  .pct { font-size: 32px; font-weight: 700; }
  .reset { color: var(--muted); font-size: 13px; text-align: right; }
  .bar { height: 10px; background: var(--track); border-radius: 6px; margin-top: 12px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 6px; transition: width .6s ease; }
  .credits { font-size: 26px; font-weight: 700; margin-top: 8px; }
  .error { color: var(--bad); max-width: 640px; margin-top: 20px; white-space: pre-wrap; }
  button {
    margin-top: 28px; background: var(--accent); color: #fff; border: 0;
    padding: 10px 22px; border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  button:hover { opacity: .9; }
</style>
</head>
<body>
  <h1>Claude Kullanım Limitleri</h1>
  <div id="updated">yükleniyor…</div>
  <div class="grid" id="grid"></div>
  <div class="error" id="error"></div>
  <button onclick="load()">Yenile</button>

<script>
const LABELS = { session: "5 Saatlik Oturum", weekly_all: "Haftalık (Tüm Modeller)", weekly_opus: "Haftalık Opus", weekly_sonnet: "Haftalık Sonnet" };

function color(p) { return p >= 90 ? "var(--bad)" : p >= 70 ? "var(--warn)" : "var(--ok)"; }

function timeLeft(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return "sıfırlandı";
  const h = Math.floor(ms / 3.6e6), m = Math.floor((ms % 3.6e6) / 6e4);
  const d = Math.floor(h / 24);
  return d > 0 ? `${d}g ${h % 24}s sonra sıfırlanır` : `${h}s ${m}dk sonra sıfırlanır`;
}

function limitCard(l) {
  const label = LABELS[l.kind] || l.kind;
  return `<div class="card">
    <h2>${label}</h2>
    <div class="row">
      <span class="pct" style="color:${color(l.percent)}">%${l.percent}</span>
      <span class="reset">${timeLeft(l.resets_at)}<br>${new Date(l.resets_at).toLocaleString("tr-TR")}</span>
    </div>
    <div class="bar"><div style="width:${Math.min(l.percent,100)}%;background:${color(l.percent)}"></div></div>
  </div>`;
}

function creditsCard(spend) {
  if (!spend?.enabled) return "";
  const used = spend.used ? (spend.used.amount_minor / 10 ** spend.used.exponent).toFixed(2) : "0.00";
  return `<div class="card">
    <h2>Ekstra Kullanım Kredisi</h2>
    <div class="credits">$${used} <span style="font-size:14px;color:var(--muted)">harcandı (${spend.used?.currency || "USD"})</span></div>
  </div>`;
}

async function load() {
  const errEl = document.getElementById("error");
  errEl.textContent = "";
  try {
    const res = await fetch("/api/usage");
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.status);
    document.getElementById("grid").innerHTML =
      (data.limits || []).map(limitCard).join("") + creditsCard(data.spend);
    document.getElementById("updated").textContent =
      "Son güncelleme: " + new Date().toLocaleTimeString("tr-TR");
  } catch (e) {
    errEl.textContent = "Hata: " + e.message;
    document.getElementById("updated").textContent = "";
  }
}

load();
setInterval(load, 60_000);
</script>
</body>
</html>
