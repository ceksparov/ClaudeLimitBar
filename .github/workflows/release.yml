name: Release

# Push a tag like "v0.3.0" and this builds BOTH apps, packages them, and
# publishes one GitHub Release carrying a zip for each platform — no manual
# build/publish steps on anyone's machine.
#
# Both platforms hang off the same tag deliberately. Releasing them separately
# would leave whoever lands on the Releases page having to work out which
# macOS build a given Windows build belongs with, and the answer would depend
# on which of the two was tagged more recently.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        # build-app.sh reads the tag with `git describe` when VERSION isn't
        # set, and a shallow clone carries no tags for it to find. The
        # workflow passes VERSION in anyway, so this is only here to keep the
        # script's own fallback honest if that ever changes.
        with:
          fetch-depth: 0

      - run: swift test
        working-directory: macos

      # The tag is the single source of the version — see build-app.sh.
      - name: Build and package
        working-directory: macos
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" ./build-app.sh --zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: macos/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # Release configuration is already self-contained and single-file (see
      # ClaudeUsage.csproj), so what lands in publish/ is what a user runs —
      # no .NET runtime to install first.
      - name: Publish
        working-directory: windows/ClaudeUsage
        run: dotnet publish -c Release

      - name: Package
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '^v', ''
          $publish = "windows/ClaudeUsage/bin/Release/net9.0-windows/win-x64/publish"
          Compress-Archive -Path "$publish/*" -DestinationPath "ClaudeLimitBar-$version-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"
          if-no-files-found: error

  # Kept separate so a release is only ever created once both platforms have
  # actually built. Publishing from inside either build job would mean a
  # failure on the other side leaving a half-populated release on the page.
  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --prerelease
